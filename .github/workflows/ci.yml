name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: relayforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://relayforge:integration-only@127.0.0.1:5432/relayforge_test?sslmode=disable
      INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go test -race -tags integration -count=1 ./tests/integration
      - run: make lint
      - run: make test-console-ui
      - run: python3 -m unittest discover -s scripts -p test_benchmark.py
      - run: go build ./...
      - run: docker build -t relayforge-ci .
