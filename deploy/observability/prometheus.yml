global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/relayforge/alerts.yml
scrape_configs:
  - job_name: relayforge-api
    static_configs:
      - targets: [host.docker.internal:9091]
    scrape_timeout: 4s
  - job_name: relayforge-worker
    static_configs:
      - targets: [host.docker.internal:8081]
    scrape_timeout: 4s
