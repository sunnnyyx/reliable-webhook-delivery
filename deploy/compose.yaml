name: relayforge
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: relayforge
      POSTGRES_DB: relayforge_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge -d relayforge_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine
    profiles: ["rate-limit"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    command: ["--config.file=/etc/relayforge/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - observability_config:/etc/relayforge:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_PATHS_PROVISIONING: /etc/relayforge/grafana/provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-relayforge-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - observability_config:/etc/relayforge:ro
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:14318:4318"]
volumes:
  observability_config:
    name: relayforge_observability_config
    external: true
  postgres_data:
